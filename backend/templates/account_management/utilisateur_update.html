{# 
  Ce template est dédié à l'édition d'un Compte existant.
  Note : CompteForm inclut le champ "utilisateur" (réassignation possible du propriétaire
  du compte). En édition ce n'est en principe pas souhaitable : ce template affiche donc
  l'utilisateur associé en lecture seule au lieu du <select> généré par le formulaire,
  sans qu'il soit nécessaire de modifier forms.py.
#}
{% extends "base.html" %}

{% block title %}{{ titre }} – ICOSNET DSI{% endblock %}
{% block page_title %}{{ titre }}{% endblock %}
{% block page_sub %}{{ sous_titre }}{% endblock %}
{% block nav_accounts %}active{% endblock %}

{% block extra_style %}
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid #e8edf5; border-radius: 10px;
    font-size: .85rem; color: #2d3748; background: #fff; font-family: 'Poppins', sans-serif;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: #2d5be3; box-shadow: 0 0 0 3px rgba(45,91,227,.1); }
  .form-group .field-errors { color: #c53030; font-size: .75rem; margin-top: 2px; }
  .read-only-value { padding: 10px 14px; border: 1.5px solid #e8edf5; border-radius: 10px; background: #f7f9fc; font-size: .85rem; color: #718096; }
{% endblock %}

{% block content %}
  <div class="page-header fade-in">
    <div class="page-header-left">
      <h1>{{ titre }}</h1>
      <p>{{ sous_titre }}</p>
    </div>
  </div>

  <div class="form-card fade-in delay-1" style="max-width:720px;">
    {% if form.non_field_errors %}
      <div class="msg-error">{{ form.non_field_errors|striptags }}</div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="form-section-title">Modifier le compte</div>

      <div class="form-grid">
        <div class="form-group">
          <label>Utilisateur associé</label>
          <div class="read-only-value">{{ compte.utilisateur.get_full_name|default:compte.utilisateur.username }}</div>
        </div>

        {% for field in form %}
          {% if field.name != "utilisateur" %}
            <div class="form-group">
              <label for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}<div class="field-errors">{{ field.errors|striptags }}</div>{% endif %}
            </div>
          {% endif %}
        {% endfor %}
      </div>

      <div style="display:flex; gap:10px; margin-top:26px;">
        <button type="submit" class="btn-submit">
          <svg width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Enregistrer les modifications
        </button>
        <a href="{% url 'account_management:detail' pk=compte.pk %}" class="btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
{% endblock %}
