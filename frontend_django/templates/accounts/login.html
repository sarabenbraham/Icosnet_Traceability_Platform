<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – Plateforme DSI ICOSNET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Poppins', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #1e3f8a 0%, #0f1e45 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }
    #bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .login-card { background: #ffffff; border-radius: 20px; width: 100%; max-width: 440px; padding: 40px 36px; box-shadow: 0 20px 60px rgba(10,24,50,.4); position: relative; z-index: 1; }
    .brand-header { text-align: center; margin-bottom: 28px; }
    .brand-icon { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg,#2d5be3,#1a3470); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; box-shadow: 0 4px 14px rgba(45,91,227,.35); }
    .brand-title { font-size: 1.45rem; font-weight: 700; color: #0f1e45; font-family: 'Quicksand', sans-serif; line-height: 1.2; }
    .brand-sub { font-size: .8rem; color: #718096; margin-top: 4px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label { font-size: .72rem; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: .06em; }
    .form-input { width: 100%; padding: 11px 16px; border: 1.5px solid #e8edf5; border-radius: 10px; font-size: .88rem; color: #2d3748; background: #fff; outline: none; transition: border-color .2s, box-shadow .2s; font-family: 'Poppins', sans-serif; }
    .form-input:focus { border-color: #2d5be3; box-shadow: 0 0 0 3.5px rgba(45,91,227,.12); }

    .btn-login { width: 100%; padding: 12px; border-radius: 10px; background: linear-gradient(135deg,#2d5be3,#1a3470); color: #fff; font-size: .9rem; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(45,91,227,.35); transition: opacity .2s, transform .15s; font-family: 'Poppins', sans-serif; margin-top: 8px; }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); }

    .msg-error { background: #fff5f5; border: 1px solid #fed7d7; color: #c53030; padding: 10px 14px; border-radius: 10px; font-size: .82rem; margin-bottom: 18px; text-align: center; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="login-card fade-in">
  <div class="brand-header">
    <div class="brand-icon">
      <svg width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-title">ICOSNET DSI</div>
    <div class="brand-sub">Connexion à la plateforme de traçabilité</div>
  </div>

  {% if messages %}
    {% for message in messages %}
      <div class="msg-error">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" action="">
    {% csrf_token %}

    <div class="form-group">
      <label for="{{ form.username.id_for_label }}">Identifiant / Email</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label for="{{ form.password.id_for_label }}">Mot de passe</label>
      {{ form.password }}
    </div>

    <button type="submit" class="btn-login">
      Se connecter
    </button>
  </form>
</div>

<script>
  (function() {
    const canvas = document.getElementById('bg-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    for(let i=0; i<40; i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.8, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fill();
    }
  })();
</script>

</body>
</html>
